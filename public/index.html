<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Gateway</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; width: 200px; }
        button { padding: 10px 20px; background: #38bdf8; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌐 Proxy Gateway</h2>
        <input type="text" id="url" placeholder="google.com">
        <button onclick="go()">Launch</button>
    </div>

    <script>
        function go() {
            let url = document.getElementById('url').value;
            if(!url) return;
            // Remove http if user typed it
            url = url.replace(/^https?:\/\//, '');
            // Redirects the current page to the proxy route on your server
            window.location.href = `/proxy/${url}`;
        }
    </script>
</body>
</html>
